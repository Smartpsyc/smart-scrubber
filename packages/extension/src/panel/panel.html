<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Scrubber</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/icon-32.png">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <div class="brand-row"><img class="mark" src="../icons/icon.svg" alt="" width="22" height="22"><strong data-i18n="appName"></strong> <span class="muted" id="version"></span></div>
      <div class="byline" data-i18n="byline"></div>
    </div>
    <div class="bar-actions">
      <button type="button" id="lang" class="ghost"></button>
      <button type="button" id="open-settings" class="ghost" data-i18n-title="settings" aria-haspopup="dialog">⚙</button>
    </div>
  </header>

  <div id="status" class="status" role="status" aria-live="polite"></div>

  <section id="disclaimer" class="notice" hidden>
    <p data-i18n="disclaimer"></p>
    <button type="button" id="disclaimer-ok" data-i18n="disclaimerOk"></button>
  </section>

  <div id="case-notice" class="notice warn" hidden></div>

  <!-- 1 · Anonymize -->
  <details class="step" id="step1" open>
    <summary><span class="step-n">1</span><span data-i18n="step1Title"></span></summary>
    <div class="step-body">
      <div id="article-box">
        <p class="field-label"><span data-i18n="composeTitle"></span> <span class="count" id="article-count"></span></p>
        <div id="drop" class="drop">
          <span data-i18n="fileDrop"></span>
          <button type="button" id="file-btn" class="link" data-i18n="fileChoose"></button>
          <input type="file" id="file" accept=".docx,.pdf,.txt,.md,.png,.jpg,.jpeg,.webp,.bmp,.gif,text/plain,application/pdf,image/*,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
          <span id="file-msg" class="msg" role="status"></span>
        </div>
        <textarea id="compose" dir="auto" rows="6" data-i18n-ph="composePlaceholder" data-i18n-aria="composeTitle"></textarea>
      </div>

      <!-- Quick path: paste, click. Everything else lives in this fold; inside it one part is open at a time. -->
      <details class="sub more-box" id="more-box">
        <summary><span data-i18n="moreTitle"></span> <span class="count" id="more-count"></span></summary>
        <details class="sub" id="suggestions-wrap" name="s1" hidden>
          <summary><span data-i18n="suggestionsTitle"></span> <span class="count" id="found-count"></span></summary>
          <p class="hint" data-i18n="suggestionsHint"></p>
          <ul id="suggestions" class="chips"></ul>
        </details>

        <details class="sub" id="people-box" name="s1">
          <summary><span data-i18n="peopleTitle"></span> <span class="count" id="people-count"></span></summary>
          <div class="row between">
            <div class="seg" role="radiogroup">
              <button type="button" role="radio" id="mode-manual" data-mode="manual" data-i18n="modeManual"></button>
              <button type="button" role="radio" id="mode-auto" data-mode="auto" data-i18n="modeAuto"></button>
            </div>
            <span id="mode-hint" class="hint"></span>
          </div>
          <ul id="entities" class="chips"></ul>
          <details class="sub inner" id="add-box">
            <summary data-i18n="addTitle"></summary>
              <form id="add-form" class="add-form" autocomplete="off">
                <select id="add-kind" aria-label="kind">
                  <option value="person" data-i18n="kindPerson"></option>
                  <option value="town" data-i18n="kindTown"></option>
                  <option value="school" data-i18n="kindSchool"></option>
                  <option value="job" data-i18n="kindJob"></option>
                  <option value="other" data-i18n="kindOther"></option>
                </select>
                <div class="fields" data-for="person">
                  <label><span data-i18n="firstName"></span><input name="first" dir="auto"></label>
                  <label><span data-i18n="lastName"></span><input name="last" dir="auto"></label>
                  <label><span data-i18n="gender"></span>
                    <select name="gender">
                      <option value="f" data-i18n="female"></option>
                      <option value="m" data-i18n="male"></option>
                      <option value="x" data-i18n="unknown"></option>
                    </select>
                  </label>
                  <label><span data-i18n="role"></span><select name="role" id="role-select"></select></label>
                  <details class="more wide">
                    <summary data-i18n="moreFields"></summary>
                    <div class="fields">
                      <label><span data-i18n="firstOther"></span><input name="firstOther" dir="auto"></label>
                      <label><span data-i18n="lastOther"></span><input name="lastOther" dir="auto"></label>
                      <label class="wide"><span data-i18n="nicknames"></span><input name="nicknames" dir="auto"></label>
                    </div>
                  </details>
                </div>
                <div class="fields" data-for="town school">
                  <label><span data-i18n="placeName"></span><input name="place" dir="auto"></label>
                  <label><span data-i18n="placeOther"></span><input name="placeOther" dir="auto"></label>
                </div>
                <div class="fields" data-for="job">
                  <label><span data-i18n="jobTitle"></span><input name="job" dir="auto"></label>
                  <label><span data-i18n="replaceWith"></span><input name="jobReplace" dir="auto"></label>
                </div>
                <div class="fields" data-for="other">
                  <label><span data-i18n="otherText"></span><input name="other" dir="auto"></label>
                  <label><span data-i18n="replaceWith"></span><input name="otherReplace" dir="auto"></label>
                </div>
                <div class="row">
                  <button type="submit" id="add-btn" data-i18n="add"></button>
                  <span id="add-error" class="error" role="alert"></span>
                </div>
              </form>
          </details>
        </details>


        <details class="sub" id="preview-box" name="s1">
          <summary><span data-i18n="previewTitle"></span> <span class="count" id="preview-count"></span></summary>
          <p class="hint" data-i18n="previewHint"></p>
          <div id="preview" class="textbox" dir="auto" data-testid="preview"></div>
        </details>
        <details class="sub" id="outgoing-box" name="s1">
          <summary data-i18n="outgoingTitle"></summary>
          <div id="outgoing" class="textbox outgoing" dir="auto" data-testid="outgoing"></div>
        </details>
      </details>

      <div id="residual" class="notice danger" hidden></div>
      <div class="row">
        <button type="button" id="insert" class="primary" data-i18n="insert"></button>
        <button type="button" id="copy-out" data-i18n="copyOut"></button>
      </div>
      <p id="send-msg" class="msg" role="status"></p>
    </div>
  </details>

  <!-- 2 · Restore -->
  <details class="step" id="step2">
    <summary><span class="step-n">2</span><span data-i18n="step2Title"></span></summary>
    <div class="step-body">
      <button type="button" id="bring-back" class="primary big">
        <span class="big-main" data-i18n="restoreBtn"></span>
        <span class="big-sub" data-i18n="restoreBtnSub"></span>
      </button>
      <p id="restore-msg" class="msg" role="status"></p>

      <details class="sub" id="paste-box">
        <summary data-i18n="pasteToggle"></summary>
        <textarea id="paste" dir="auto" rows="3" data-i18n-ph="pastePlaceholder"></textarea>
        <button type="button" id="restore-paste" data-i18n="restorePasted"></button>
      </details>

      <div id="restored-wrap" hidden>
        <p class="field-label" data-i18n="restoredTitle"></p>
        <div id="restored" class="textbox tall" dir="auto" data-testid="restored"></div>
        <div id="unresolved" class="notice warn" hidden></div>
        <div class="row">
          <button type="button" id="copy" data-i18n="copy"></button>
          <button type="button" id="export" data-i18n="exportMd"></button>
        </div>
        <aside class="offer" id="offer" aria-labelledby="offer-h">
          <p class="offer-h" id="offer-h" data-i18n="offerTitle"></p>
          <p class="offer-p" data-i18n="offerText"></p>
          <a class="btn-outline" href="https://smartpsyc.com" target="_blank" rel="noopener" data-i18n="offerBtn"></a>
        </aside>
      </div>
    </div>
  </details>

  <footer class="site-foot">
    <strong data-i18n="footBy"></strong> · <span data-i18n="footText"></span>
    <a href="https://smartpsyc.com" target="_blank" rel="noopener" dir="ltr">smartpsyc.com</a>
  </footer>

  <div id="tag-menu" class="tag-menu" role="menu" hidden>
    <span class="muted" data-i18n="tagAs"></span>
    <button type="button" role="menuitem" data-tag="f" data-i18n="tagFemale"></button>
    <button type="button" role="menuitem" data-tag="m" data-i18n="tagMale"></button>
    <button type="button" role="menuitem" data-tag="town" data-i18n="tagPlace"></button>
    <button type="button" role="menuitem" data-tag="school" data-i18n="tagSchool"></button>
    <button type="button" role="menuitem" data-tag="other" data-i18n="tagOther"></button>
  </div>

  <dialog id="settings">
    <form method="dialog" class="settings-form">
      <h2 data-i18n="settings"></h2>
      <label><span data-i18n="retention"></span><input type="number" id="retention" min="1" max="365"></label>
      <label><span data-i18n="community"></span>
        <select id="community">
          <option value="general" data-i18n="communityGeneral"></option>
          <option value="arab" data-i18n="communityArab"></option>
        </select>
      </label>
      <p class="hint" data-i18n="disclaimer"></p>
      <p class="hint"><span data-i18n="by"></span> · <span id="version2"></span></p>
      <div class="row between">
        <button type="button" id="delete-case" class="quiet-danger" data-i18n="deleteCase"></button>
        <button value="close" data-i18n="close"></button>
      </div>
      <span id="settings-msg" class="msg"></span>
    </form>
  </dialog>

  <script src="../vendor/mammoth/mammoth.browser.min.js"></script>
  <script type="module" src="panel.js"></script>
</body>
</html>
